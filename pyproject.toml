[project]
name = "knobeln-auswertung"
version = "0.1.0"
description = "CLI zur Auswertung gescannter Knobeln-Protokollbögen"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "typer>=0.15",
    "rich>=13.9",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
knobeln = "knobeln.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knobeln"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
