[project]
name = "knobeln-auswertung"
version = "0.1.0"
description = "Lokale Web-App zur Auswertung gescannter Knobeln-Protokollbögen"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=8.3",
    "ruff>=0.17.4",
]

[project.scripts]
knobeln = "knobeln.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knobeln"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "manual: requires a real OPENROUTER_API_KEY and costs money; run with --run-manual",
    "browser: runs against a real headless Chromium via Playwright",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/knobeln/cli.py" = ["B008"]
"src/knobeln/store.py" = ["E501"]
"src/knobeln/web/app.py" = ["B008"]
