repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: scripts/precommit-uv.sh run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: scripts/precommit-uv.sh run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: scripts/precommit-uv.sh run pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: scripts/precommit-uv.sh run pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: detect-secrets
        name: detect-secrets
        entry: scripts/precommit-uv.sh run detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
        exclude: '^(uv\.lock|skills-lock\.json|\.secrets\.baseline)$'
